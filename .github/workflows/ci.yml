name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (format, lint, mypy --strict, tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make check
      - run: make demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-sarif
          path: out/demo.sarif

  fixtures:
    name: committed ASTs reproduce with the pinned solc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra compile
      - run: make fixtures-verify
